services:
  - type: web
    name: kwabey-scraper
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: AUTO_PING_INTERVAL_MINUTES
        value: 10
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://psvnhnaoxiluqwynnnyg.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # paste the service_role JWT in the Render dashboard
